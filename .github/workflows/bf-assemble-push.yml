name: bf-assemble-push
on:
  push:
    paths:
      - ".bf-staging/**"
      - ".github/workflows/bf-assemble-push.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bf-assemble-push
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/intro-moments-14-15-16-15b5
          fetch-depth: 0
      - name: Assemble Black Friday Moments files
        run: |
          set -euo pipefail
          test -f .bf-staging/ready.flag
          # coverage-seed from base64 parts
          cat .bf-staging/seed.part*.b64 | base64 -d > src/automations/coverage-seed.ts
          # COVERAGE from patch against current file
          patch -p1 < .bf-staging/COVERAGE.md.patch
          # remove split leftovers if present
          rm -f src/automations/coverage-seed-part1.ts src/automations/coverage-seed-part2.ts
          rm -f .bf-push-size-probe.txt
          # verify checksums
          echo "900ba3d176ea7d6bd0c3b6447865187f09837b2bb79488e79f34ec411f4d59a2  src/automations/coverage-seed.ts" | sha256sum -c
          echo "6c29cb9b079bad2c26fe705a6022e638804a15325e308493a97ce535e2cdbb2b  COVERAGE.md" | sha256sum -c
          # cleanup staging + this workflow
          rm -rf .bf-staging
          rm -f .github/workflows/bf-assemble-push.yml
          git config user.name "adminbondi"
          git config user.email "admin@balancemoves.com.au"
          git add -A
          git status
          git commit -m "Black Friday Moments: seed, lanes, tests, coverage"
          git push origin HEAD:cursor/intro-moments-14-15-16-15b5
