# Push to main publishes bm-automations-dev only.
# Tests, typecheck, and the allowlist check run first.
# GitHub Actions skips the remaining steps when one fails, so a failed
# check does not run `wrangler deploy --env dev`.
# Migrations apply before deploy; automation `enabled` flags are never changed.
# Plain-text vars come from wrangler.jsonc env.dev (DEV_MODE must stay false —
# check:dev refuses true so a main push cannot re-enable silent allowlist skips).
# See docs/dev-deploy.md. `.github/workflows/ci.yml` does not deploy.
name: deploy-dev

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Allowlist check
        run: npm run check:dev
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/apply-dev-migrations.mjs
      - name: Deploy bm-automations-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev
