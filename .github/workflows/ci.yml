# Tests and the dev allowlist check. This workflow does not deploy.
# A push to main deploys bm-automations-dev through Cloudflare Workers Builds.
# See docs/dev-deploy.md. Origin does not run this file by itself.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:dev
