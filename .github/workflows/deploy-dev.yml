# Push to main publishes bm-automations-dev only.
# Tests, typecheck, and the allowlist check run first.
# GitHub Actions skips the remaining steps when one fails, so a failed
# check does not run `wrangler deploy --env dev`.
# The automations-off check runs before and after that deploy.
# See docs/dev-deploy.md. `.github/workflows/ci.yml` does not deploy.
name: deploy-dev

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Allowlist check
        run: npm run check:dev
      - name: Automations off before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/enforce-dev-off.mjs
      - name: Deploy bm-automations-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev
      - name: Automations off after deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/enforce-dev-off.mjs
